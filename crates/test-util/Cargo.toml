# Helpers shared by hdf5-pure's own unit tests, its integration tests and the
# crosscheck package. It never depends on hdf5-pure: a test that feeds the
# reader damaged bytes must not build them with the encoder under test.
[package]
name = "test-util"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
heapscope = "0.1"
tempfile = "3"

[dev-dependencies]
rstest = "0.27"

[lints]
workspace = true
