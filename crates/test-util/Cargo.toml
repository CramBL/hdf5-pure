# Helpers shared by hdf5-pure's own unit tests, its integration tests and the
# crosscheck package. It never depends on hdf5-pure: a test that feeds the
# reader damaged bytes must not build them with the encoder under test.
[package]
name = "test-util"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
heapscope.workspace = true
tempfile.workspace = true

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
