# The test helpers that need hdf5-pure's own API, kept out of `test-util` so
# that crate stays free to build a file's bytes without the library that reads
# them.
[package]
name = "test-util-hdf5"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The same tiers as `hdf5-pure-crosscheck`, which forwards each of its own to the one here.
[features]
# Links the reference HDF5 C library for the helpers that call it.
libhdf5 = ["dep:libhdf5", "dep:libhdf5-sys", "ndarray"]
# The release series of the linked libhdf5, each implying the one below.
"__libhdf5-1.10" = ["libhdf5"]
"__libhdf5-1.12" = ["__libhdf5-1.10", "libhdf5-sys/deprecated"]
"__libhdf5-1.14" = ["__libhdf5-1.12"]
"__libhdf5-2" = ["__libhdf5-1.14"]
# Builds and links the libhdf5 that `hdf5-metno` bundles.
__libhdf5-bundled = ["libhdf5/static", "__libhdf5-2"]
# The helpers for the tests that link the system libmatio.
__matio = []

[dependencies]
hdf5-pure = { workspace = true, features = ["std"] }
hdf5-pure-core.workspace = true
hdf5-pure-format.workspace = true
libhdf5 = { workspace = true, optional = true, features = ["lzf"] }
# The C bindings used by fixture writers.
libhdf5-sys = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
# The temporary directory that holds an image opened through a path backend.
tempfile.workspace = true
test-util.workspace = true

[dev-dependencies]
rstest.workspace = true
hdf5-pure = { workspace = true, features = ["deflate"] }

[lints]
workspace = true
