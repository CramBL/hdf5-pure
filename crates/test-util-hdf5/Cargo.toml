# The test helpers that need hdf5-pure's own API, kept out of `test-util` so
# that crate stays free to build a file's bytes without the library that reads
# them.
[package]
name = "test-util-hdf5"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The same tiers as `hdf5-pure-crosscheck`, which forwards each of its own to the one here.
[features]
# Links the reference HDF5 C library for the helpers that call it.
hdf5 = ["dep:hdf5"]
# The release series of the linked libhdf5, each implying the one below.
"__hdf5-1.10" = ["hdf5"]
"__hdf5-1.12" = ["__hdf5-1.10"]
"__hdf5-1.14" = ["__hdf5-1.12"]
"__hdf5-2" = ["__hdf5-1.14"]
# Builds and links the libhdf5 that `hdf5-metno` bundles.
__hdf5-bundled = ["hdf5/static", "__hdf5-2"]
# The helpers for the tests that link the system libmatio.
__matio = []

[dependencies]
hdf5 = { workspace = true, optional = true }
hdf5-pure.workspace = true
test-util.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
