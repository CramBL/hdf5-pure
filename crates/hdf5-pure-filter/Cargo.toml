[package]
name = "hdf5-pure-filter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust HDF5 chunk filter codecs and pipelines"

[features]
default = []
std = ["hdf5-pure-core/std"]
deflate = ["std", "flate2"]
flate2 = ["dep:flate2"]
fast-deflate = ["deflate", "flate2/zlib-ng"]
zfp = []

[dependencies]
hdf5-pure-core.workspace = true
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
