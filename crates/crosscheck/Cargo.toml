# The external tests that check hdf5-pure against libhdf5. Release features also enable
# reference helpers for the facade's private unit tests through `test-util-hdf5`.
[package]
name = "hdf5-pure-crosscheck"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

# Writes fixtures for tests of interrupted writers.
[[bin]]
name = "interrupted-writer"
path = "tests/fixtures/interrupted_writer.rs"
test = false
bench = false
required-features = ["__hdf5-1.10"]

# Isolates native dense-attribute reads and writes from test processes.
[[bin]]
name = "dense-attributes"
path = "tests/fixtures/dense_attributes.rs"
test = false
bench = false
required-features = ["__hdf5-1.10"]

# Reads successive SWMR append states in fresh native processes.
[[bin]]
name = "swmr-reader"
path = "tests/fixtures/swmr_reader.rs"
test = false
bench = false
required-features = ["__hdf5-1.10"]

# Measures bounded writable recovery of native fragmented PAGE files.
[[bench]]
name = "fragmented_recovery"
harness = false
required-features = ["__hdf5-1.10"]

[features]
serde = ["hdf5-pure/serde"]
ndarray = ["hdf5-pure/ndarray"]
# Checks dataset values, content hashes, and creator metadata through the reference library.
provenance = ["hdf5-pure/provenance"]
# Links the reference HDF5 C library (the optional `hdf5-metno` dependency,
# aliased `hdf5` below, and its raw bindings, aliased `hdf5-sys`). Named
# explicitly, so it stays the one name for this and nothing invents a second.
hdf5 = ["dep:hdf5", "dep:hdf5-sys", "dep:serde", "dep:serde_json", "test-util-hdf5/hdf5"]
# Which release series of libhdf5 the tests link, from 1.10 up: none of them
# is 1.8. Each implies the one below, so a test gates on the lowest series that
# has what it needs. The interop recipes derive it from the version they link,
# and `tests/main/hdf5_release_feature.rs` checks the one passed against the library
# actually linked.
"__hdf5-1.10" = ["hdf5", "test-util-hdf5/__hdf5-1.10"]
"__hdf5-1.12" = ["__hdf5-1.10", "hdf5-sys/deprecated", "test-util-hdf5/__hdf5-1.12"]
"__hdf5-1.14" = ["__hdf5-1.12", "test-util-hdf5/__hdf5-1.14"]
"__hdf5-2" = ["__hdf5-1.14", "test-util-hdf5/__hdf5-2"]
# Builds and links the libhdf5 that `hdf5-metno` bundles instead of searching
# the host, a 2.x release. Implies `__hdf5-2`. Without it the package links the
# installation under `HDF5_DIR`.
__hdf5-bundled = ["hdf5/static", "__hdf5-2", "test-util-hdf5/__hdf5-bundled"]
# Test-only: links against the system libmatio (reference MATLAB MAT file library).
# `build.rs` emits link directives for this feature, and the crosscheck lives in
# `tests/main/matio_crosscheck.rs`.
__matio = ["serde", "test-util-hdf5/__matio"]

[dependencies]
hdf5 = { workspace = true, optional = true }
# The raw libhdf5 bindings, for the object header address `hdf5-metno` does not
# expose. `__hdf5-1.12` turns on their `deprecated` feature, since the function
# that reports the address is a deprecated symbol from 1.12 on.
hdf5-sys = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
test-util-hdf5 = { workspace = true, optional = true }

# Crosscheck targets use both bindings behind the `hdf5` feature.
[package.metadata.cargo-shear]
ignored = ["hdf5-sys"]

[dev-dependencies]
insta.workspace = true
hdf5-pure = { workspace = true, default-features = true }
# The address type the hdf5-pure-format parsers and writers take, for the tests that call them.
hdf5-pure-core.workspace = true
hdf5-pure-format.workspace = true
# Exercises the pure allocation policy against the reference library's placements.
hdf5-pure-space.workspace = true
ndarray.workspace = true
proptest.workspace = true
rstest.workspace = true
serde = { version = "1", features = ["derive"] }
tempfile.workspace = true
test-util.workspace = true
test-util-hdf5.workspace = true

[lints]
workspace = true
