# The tests that check hdf5-pure against the reference C library. The only
# package that turns libhdf5 on: the crate's own suite, its examples and every
# other job build without a C toolchain or a C library.
[package]
name = "hdf5-pure-crosscheck"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[features]
serde = ["hdf5-pure/serde"]
ndarray = ["hdf5-pure/ndarray"]
# Links the reference HDF5 C library (the optional `hdf5-metno` dependency,
# aliased `hdf5` below). Named explicitly, so it stays the one name for this
# and nothing invents a second.
hdf5 = ["dep:hdf5", "test-util-hdf5/hdf5"]
# Which release series of libhdf5 the tests link, from 1.10 up: none of them
# is 1.8. Each implies the one below, so a test gates on the lowest series that
# has what it needs. The interop recipes derive it from the version they link,
# and `tests/hdf5_release_feature.rs` checks the one passed against the library
# actually linked.
"__hdf5-1.10" = ["hdf5", "test-util-hdf5/__hdf5-1.10"]
"__hdf5-1.12" = ["__hdf5-1.10", "test-util-hdf5/__hdf5-1.12"]
"__hdf5-1.14" = ["__hdf5-1.12", "test-util-hdf5/__hdf5-1.14"]
"__hdf5-2" = ["__hdf5-1.14", "test-util-hdf5/__hdf5-2"]
# Builds and links the libhdf5 that `hdf5-metno` bundles instead of searching
# the host, a 2.x release. Implies `__hdf5-2`. Without it the package links the
# installation under `HDF5_DIR`.
__hdf5-bundled = ["hdf5/static", "__hdf5-2", "test-util-hdf5/__hdf5-bundled"]
# Test-only: links against the system libmatio (reference MATLAB MAT file library).
# `build.rs` emits link directives for this feature, and the crosscheck lives in
# `tests/matio_crosscheck.rs`.
__matio = ["serde", "test-util-hdf5/__matio"]

[dependencies]
hdf5 = { package = "hdf5-metno", git = "https://github.com/metno/hdf5-rust", rev = "605a2e28c17f2209bf2a6d0a8be11ef0b6546034", features = ["zlib"], optional = true }

# The `hdf5` feature turns the dependency on for the tests, the package's only targets.
[package.metadata.cargo-shear]
ignored = ["hdf5"]

[dev-dependencies]
hdf5-pure = { path = "../.." }
ndarray = ">=0.16, <0.18"
proptest = "1"
rstest = "0.27"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
test-util = { path = "../test-util" }
test-util-hdf5 = { path = "../test-util-hdf5" }

[lints]
workspace = true
