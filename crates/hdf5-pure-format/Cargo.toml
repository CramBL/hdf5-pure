[package]
name = "hdf5-pure-format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["hdf5", "serialization", "parser", "scientific", "no-std"]
categories = ["encoding", "parser-implementations", "science", "no-std"]
description = "Pure-Rust HDF5 on-disk structures and codecs"
include = ["/src/**", "/LICENSE-*", "/README.md"]

[features]
default = ["checksum"]
std = ["hdf5-pure-core/std"]
checksum = []

[dependencies]
hdf5-pure-core.workspace = true
byteorder.workspace = true

[dev-dependencies]
rstest.workspace = true
test-util.workspace = true

[lints]
workspace = true
