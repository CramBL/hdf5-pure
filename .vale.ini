StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/Slop.zip
Vocab = Hdf5Pure

# Code comments are parsed as Markdown: inline code and fences are skipped.
# `.commit` is the format for a commit message on stdin (--ext=.commit).
[formats]
commit = md
rs = md
py = md

[*]
BasedOnStyles = Vale, Slop, Hdf5Pure
# Hdf5Pure.Spelling is Vale.Spelling with a filter for possessives.
Vale.Spelling = NO
# Vale.Terms enforces the vocabulary's casing, which flags crate names in headings.
Vale.Terms = NO
# Forked into Hdf5Pure with exceptions.
Slop.Anthropomorphism = NO
Slop.Overused = NO
Slop.NegativeParallelism = NO
# Hdf5Pure.Dash covers it.
Slop.EmDash = NO
# Every rule reports as an error: a warning is a permission to ignore it.
Slop.Assistant = error
Slop.Ceremony = error
Slop.EmptyQualifiers = error
Slop.Headers = error
Slop.Hedging = error
Slop.Metaphor = error
Slop.RestatesCode = error
Slop.SelfPraise = error
Slop.Transitions = error
Slop.Tricolon = error
Slop.VagueReasons = error
Slop.Vocabulary = error
# Commit-only rules.
Hdf5Pure.CommitTrailer = NO
Hdf5Pure.CommitTrailerCase = NO
Hdf5Pure.CommitSubject = NO
Hdf5Pure.CommitSubjectLength = NO
Hdf5Pure.CommitSubjectBlankLine = NO
Hdf5Pure.CommitBodyLength = NO
Hdf5Pure.CommitCoauthorTool = NO
Hdf5Pure.CommitCoauthorAddress = NO

[*.commit]
Hdf5Pure.CommitTrailer = YES
Hdf5Pure.CommitTrailerCase = YES
Hdf5Pure.CommitSubject = YES
Hdf5Pure.CommitSubjectLength = YES
Hdf5Pure.CommitSubjectBlankLine = YES
Hdf5Pure.CommitBodyLength = YES
Hdf5Pure.CommitCoauthorTool = YES
Hdf5Pure.CommitCoauthorAddress = YES
