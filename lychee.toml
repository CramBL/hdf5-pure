no_progress = true

# A host that is slow or rate-limiting today must not fail the run: retry
# before declaring a link dead, and treat 429 as a live host.
max_retries = 5
retry_wait_time = 2
accept = ["200..=299", "429"]

# The link checks skip a private or local address, which belongs to a machine and not the web.
exclude_all_private = true

exclude = [
    # Blocks every non-browser client with 403.
    '^https://www\.mathworks\.com/',
    # `release::prepare` writes the changelog's newest compare links from the tag that
    # `release::publish` creates only after the release commit merges, so that pair is
    # unreachable while `just hygiene::lychee-added` runs. Every compare link in the block has
    # the form `promote_changelog` writes, asserted in `scripts/python/tests/test_release.py`,
    # so the pattern excludes the older, reachable ones and the weekly sweep skips them as well.
    '^https://github\.com/CramBL/hdf5-pure/compare/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?\.\.\.(v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?|HEAD)$',
]
