[build.env]
passthrough = [
    "CARGO_PROFILE_TEST_OPT_LEVEL",
    "CARGO_PROFILE_TEST_DEBUG_ASSERTIONS",
    "CARGO_PROFILE_TEST_OVERFLOW_CHECKS",
    "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_RUSTFLAGS",
    "CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_RUSTFLAGS",
]

[target.i686-unknown-linux-gnu]
image = "ghcr.io/crambl/hdf5-pure-cross-i686:latest"
# Runs the test harness and fixture children through QEMU.
runner = "qemu-user"

[target.s390x-unknown-linux-gnu]
image = "ghcr.io/crambl/hdf5-pure-cross-s390x:latest"
# Runs the test harness and fixture children through QEMU.
runner = "qemu-user"
