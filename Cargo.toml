[package]
name = "hdf5-pure"
version = "0.44.1"
edition = "2024"
# `std::fs::File` advisory locking (used by the write/edit/read open paths for
# concurrent-writer detection, issue #73) stabilized in Rust 1.89.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Pure-Rust HDF5 library: read, write, and edit files in place (WASM-compatible, no C dependencies)"
repository = "https://github.com/CramBL/hdf5-pure"
keywords = ["hdf5", "serialization", "scientific", "no-std", "wasm"]
categories = ["science", "encoding", "filesystem", "wasm", "no-std"]
build = "build.rs"
# What the published crate holds: the library, its build script, the examples, the guide pages
# `src/_guide/` includes into the documentation, and the documents a user reads. Tests, test data,
# tooling and the rest of the docs site stay in the repository.
include = [
    "/src/**",
    "/build.rs",
    "/examples/**",
    "/docs/guide/compression.md",
    "/docs/guide/editing.md",
    "/docs/guide/groups-attributes.md",
    "/docs/guide/reading.md",
    "/docs/guide/streaming.md",
    "/docs/guide/writing.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-*",
]

# Publish the full public API on docs.rs. The default feature set hides the
# `ndarray`, `serde` (`mat`), `zfp`, and `provenance` surfaces (and
# leaves their cross-references as dead links); `matio-crosscheck` is a
# test-only feature and is deliberately excluded.
[package.metadata.docs.rs]
features = ["provenance", "zfp", "ndarray", "serde", "num-complex"]
# `src/lib.rs` enables rustdoc's `doc_cfg` under this cfg, so each gated
# item shows the feature that brings it.
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "checksum", "deflate"]
std = []
checksum = []
deflate = ["flate2"]
fast-deflate = ["flate2/zlib-ng"]
provenance = ["sha2"]
# Pure-Rust ZFP fixed-rate compression filter (HDF5 filter ID 32013).
# Supports f32/f64/i32/i64 datasets in 1D–4D.
zfp = []
# Ergonomic N-dimensional array I/O via the `ndarray` crate
# (`DatasetBuilder::with_ndarray`, `Dataset::read_array`/`read_array_dyn`).
# Requires `std` (it builds on the File/Dataset reader and writer APIs).
ndarray = ["dep:ndarray", "std"]
# Serde-based (de)serialization of MATLAB v7.3 .mat files.
# Requires `std` (uses File/Group/Dataset reader APIs).
serde = ["dep:serde", "std"]
# `mat::ComplexElement` impls for `num_complex::Complex<T>`, so the bulk array
# helpers in `mat::complex` take the de-facto standard Rust complex type
# directly. The trait is `unsafe` and asserts a memory layout, so the orphan
# rule puts these impls on whichever crate owns one of the two types — us, not
# the caller.
num-complex = ["dep:num-complex", "serde"]
# Test-only: check the exact allocation figures of `tests/allocation_baseline.rs`
# against the numbers committed under `tests/baselines/`. Off by default because
# those numbers are recorded on one platform: the scaling *rules* in
# `tests/allocation_bounds.rs` hold everywhere and run in every configuration,
# while an exact count is a property of one target and one toolchain. Both test
# files document the split at length.
heap-baseline = []
# Test-only: enable a crosscheck test that links against the system libmatio
# (reference MATLAB MAT file library). Requires libmatio to be installed:
# `brew install libmatio` (macOS), `apt install libmatio-dev` (Debian) or
# `paru -S matio` (Arch).
# Not a run-time dependency — build.rs only emits link directives for this
# feature, and the crosscheck lives in a gated integration test.
matio-crosscheck = ["serde"]

[dependencies]
byteorder = { version = "1", default-features = false }
flate2 = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.10", optional = true, default-features = false }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }
# A permissive range (like `hdf5-metno`'s own `ndarray` requirement) so the
# user's existing `ndarray` unifies with ours instead of compiling a second
# copy. Only APIs stable across 0.16/0.17 are used.
ndarray = { version = ">=0.16, <0.18", optional = true }
# Carries only `ComplexElement` impls. No API of ours names a `Complex<T>`, so
# nothing here appears in a public signature.
num-complex = { version = "0.4", optional = true, default-features = false }

[dev-dependencies]
# Heap profiler and test-time allocation budgets (issue #228). It is the
# `#[global_allocator]` of `tests/allocation_bounds.rs`,
# `tests/allocation_baseline.rs` and `examples/heap_profile.rs`, and nothing
# else links it.
#
# Not optional, because cargo forbids optional dev-dependencies, so it compiles
# on every `cargo test`. That costs about two seconds once — it has no
# dependencies of its own — and raises the floor for *building the test suite*
# to its own MSRV of 1.96. The `rust-version` this crate promises its users is
# unaffected: a dependent never builds our dev-dependencies.
heapscope = "0.1"
tempfile = "3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Property-based testing for the write/read roundtrip and parser-robustness
# invariants (issue #26).
proptest = "1"
# Benchmark harness for the read/write hot paths (benches/hot_paths.rs). Default
# features are off to avoid pulling the plotting/HTML-report dependency tree; the
# benches report to the terminal, which is enough for before/after comparison.
criterion = { version = "0.5", default-features = false }
test-util = { path = "crates/test-util" }

# The reference HDF5 C library, used only by the byte-level crosscheck tests.
# Its `static` feature compiles libhdf5 from source via CMake, which does not
# cross-compile cleanly and is unnecessary on the targets excluded here anyway.
# Gate it to 64-bit little-endian so `cross test` can run the pure-Rust suite on
# a 32-bit pointer width (`i686`) and on a big-endian host (`s390x`) without
# building any C code: a 32-bit host cannot allocate the multi-GiB fixtures
# these tests build, and the point of the big-endian run is this crate's own
# byte-order handling, not the C library's. The crosscheck test files carry the
# matching `#![cfg(all(not(target_pointer_width = "32"), target_endian =
# "little"))]` gate.
#
# The binding tracks upstream `main`, pinned by commit in `Cargo.lock` since
# every CI job runs `--locked`. `cargo update -p hdf5-metno` moves it. The
# `__hdf5-bundled` feature links the release its submodule points at, which
# `just interop::hdf5-bundled-version` prints. Without the feature it links the
# installation under `HDF5_DIR`, which is how the interop workflow tests other
# releases. Judge a bump by the crosschecks
# rather than by release notes: several of them assert constants derived from
# libhdf5 internals that a version change could move, and
# `tests/c_absence_predicate.rs` guards the assertion most sensitive to one by
# re-measuring the C library's error codes against deliberately damaged files.
[[example]]
name = "matlab_fixtures"
required-features = ["serde"]

[[example]]
name = "ndarray_io"
required-features = ["ndarray"]

[[bench]]
name = "hot_paths"
harness = false

# Style-preference clippy lints muted crate-wide. The remaining clippy
# surface is still on (`-D warnings` in CI), so genuinely problematic
# patterns continue to fail the build.
[lints]
workspace = true

# The supporting packages: the tests that link the reference C library, so that
# nothing else does, and the helpers the tests share. `fuzz` keeps its own
# lockfile.
[workspace]
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.lints.rust]
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
non_ascii_idents = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
unexpected_cfgs = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
variant_size_differences = "warn"

# Allowed today and to be turned on, each with what it flags now.
# TODO: 204 public items.
missing_docs = "allow"
# TODO: 13 types.
missing_debug_implementations = "allow"
# TODO: 3 types.
missing_copy_implementations = "allow"
# TODO: 20 paths.
elided_lifetimes_in_paths = "allow"
# TODO: 3 lifetimes.
single_use_lifetimes = "allow"
# TODO: 310 items, each becomes `pub(crate)`. The crate root is the API.
unreachable_pub = "allow"
# TODO: 70 casts.
trivial_numeric_casts = "allow"
# TODO: 59 paths.
unused_qualifications = "allow"
# TODO: 10 bindings.
let_underscore_drop = "allow"
# TODO: 3 traits.
unnameable_types = "allow"
# TODO: 10 sites, each carries an `expect` with the reason.
unsafe_code = "allow"

[workspace.lints.clippy]
# Panics. A file is untrusted input, so a panic on one is a bug. clippy.toml
# allows unwrap, expect, indexing and panic in tests.
dbg_macro = "warn"
exit = "warn"
mem_forget = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"

# `no_std`: everything below the filesystem API imports from `core` and `alloc`.
alloc_instead_of_core = "warn"

# unsafe.
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

# A directory module is its mod.rs.
self_named_module_files = "warn"

# Numeric casts and float comparisons. The truncating casts are denied on a 32-bit target by
# `just portability::cast-gate`, where they can fire.
as_ptr_cast_mut = "warn"
char_lit_as_u8 = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
imprecise_flops = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
manual_is_power_of_two = "warn"
precedence_bits = "warn"
suspicious_xor_used_as_pow = "warn"

# API shape.
default_trait_access = "warn"
empty_drop = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
into_iter_without_iter = "warn"
iter_not_returning_iterator = "warn"
iter_without_into_iter = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
macro_use_imports = "warn"
mismatching_type_param_order = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
same_name_method = "warn"

# Expressions.
debug_assert_with_mut_call = "warn"
equatable_if_let = "warn"
explicit_deref_methods = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
fn_params_excessive_bools = "warn"
ignored_unit_patterns = "warn"
index_refutable_slice = "warn"
inefficient_to_string = "warn"
infallible_try_from = "warn"
infinite_loop = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
literal_string_with_formatting_args = "warn"
manual_assert = "warn"
manual_clamp = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_flatten = "warn"
match_wild_err_arm = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_raw_string_hashes = "warn"
negative_feature_names = "warn"
rest_pat_in_fully_bound_structs = "warn"
semicolon_inside_block = "warn"

# Style-preference lints muted crate-wide, with the reason.
# Incremental byte stream construction reads more naturally as
# `let mut buf = Vec::new(); buf.push(...);` with a comment per byte.
vec_init_then_push = "allow"
# Approximate float constants in test data are intentional.
approx_constant = "allow"

# Allowed today and to be turned on, each with what it flags now.
# TODO: 31 sites. Let chains make the collapsed form read well.
collapsible_if = "allow"
# TODO: 10 sites.
manual_is_multiple_of = "allow"
# TODO: 3 sites.
same_item_push = "allow"
# TODO: 15 functions at the default threshold of 7. clippy.toml raises it to
# 10 for the format code, which has many fields per call site.
too_many_arguments = "allow"

# Panics and error handling.
# TODO: 47 sites. Each returns an error or carries an expect with the invariant.
unwrap_used = "allow"
# TODO: 65 sites.
expect_used = "allow"
# TODO: 18 sites.
unwrap_in_result = "allow"
# TODO: 1 site.
panic = "allow"
# TODO: 30 sites.
unreachable = "allow"
# TODO: 1 site.
get_unwrap = "allow"
# TODO: 3 sites. A slice of a string panics off a character boundary.
string_slice = "allow"
# TODO: 81 sites. Each keeps or converts the error it drops.
map_err_ignore = "allow"
# TODO: 8 sites. The `.ok()` rule.
let_underscore_must_use = "allow"
# TODO: 1 site. The determinism rule.
iter_over_hash_type = "allow"
# TODO: 1 site.
checked_conversions = "allow"
# TODO: 2 sites.
non_zero_suggestions = "allow"

# Lint attributes.
# TODO: 159 attributes, each becomes an `expect` with a reason, or goes.
allow_attributes = "allow"
# TODO: 160 attributes.
allow_attributes_without_reason = "allow"

# `no_std`.
# TODO: 136 imports.
std_instead_of_core = "allow"
# TODO: 53 imports.
std_instead_of_alloc = "allow"

# unsafe.
# TODO: 1 block.
multiple_unsafe_ops_per_block = "allow"

# Casts. A widening is `From`, a narrowing is `TryFrom`, and `as` is left for
# the cast whose loss is the point, marked as such.
# TODO: 1,460 sites.
as_conversions = "allow"
# TODO: 412 sites on a 64-bit host, more on 32-bit, which
# `just portability::cast-gate` denies.
cast_possible_truncation = "allow"
# TODO: 74 sites.
cast_possible_wrap = "allow"
# TODO: 58 sites.
cast_sign_loss = "allow"
# TODO: 152 sites, each a `From` conversion.
cast_lossless = "allow"
# TODO: 38 sites.
cast_precision_loss = "allow"
# TODO: 2,396 sites, most of them loop counters. Turned on per file in the
# byte-level parsers, where every operand comes off the disk, with
# `#![warn(clippy::arithmetic_side_effects)]`.
arithmetic_side_effects = "allow"

# API shape.
# TODO: 7 enums. Each addition is a breaking change, with the next minor bump.
exhaustive_enums = "allow"
# TODO: 1 struct.
exhaustive_structs = "allow"
# TODO: 12 functions.
unnecessary_wraps = "allow"
# TODO: 16 functions.
needless_pass_by_value = "allow"
# TODO: 3 functions.
ref_option = "allow"
# TODO: 12 types.
derive_partial_eq_without_eq = "allow"
# TODO: 3 `Debug` implementations.
missing_fields_in_debug = "allow"
# TODO: 179 functions. A dropped handle or shape is a bug.
must_use_candidate = "allow"
# TODO: 48 builder methods.
return_self_not_must_use = "allow"
# TODO: 689 sites, each `Self`.
use_self = "allow"

# Documentation.
# TODO: 59 doc comments with an identifier outside backticks.
doc_markdown = "allow"
# TODO: 236 functions without an Errors section.
missing_errors_doc = "allow"
# TODO: 10 functions without a Panics section.
missing_panics_doc = "allow"

# Tests.
# TODO: 239 assertions on `is_err` or `is_ok`. The exact-error rule.
assertions_on_result_states = "allow"
# TODO: 53 assertions without a message.
missing_assert_message = "allow"

# Expressions.
# TODO: 57 imports, each `use Trait as _`.
unused_trait_names = "allow"
# TODO: 44 functions over 100 lines.
too_many_lines = "allow"
# TODO: 4 sites.
manual_let_else = "allow"
# TODO: 2 sites.
uninlined_format_args = "allow"
# TODO: 21 closures.
redundant_closure_for_method_calls = "allow"
# TODO: 7 loops.
explicit_iter_loop = "allow"
# TODO: 22 matches.
match_same_arms = "allow"
# TODO: 231 wildcard arms. A variant added to a format enum is then a compile
# error at every match. A match over a `non_exhaustive` enum of another crate
# keeps its wildcard.
wildcard_enum_match_arm = "allow"
# TODO: 24 bindings.
shadow_unrelated = "allow"
# TODO: 88 sites.
str_to_string = "allow"
# TODO: 34 items.
items_after_statements = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "deny"
private_doc_tests = "deny"
unescaped_backticks = "deny"

# Fewer, larger codegen units than rustc's default of 256.
#
# The default emits up to one object file per codegen unit per crate compilation,
# and cargo never reaps them. With 97 integration-test binaries a full rebuild of
# this package creates ~9,800 objects; once `deps/` reaches six figures the scan
# cargo and rustc perform on it dominates every build; `just clean` clears them.
#
# 4 comes from the measured curve — objects per rebuild, and the time to build
# the library alone:
#
#   codegen-units    256      64      16       4       1
#   objects        9,789   7,495   1,584     606     161
#   library           8s      8s      9s     10s     13s
#
# The library is the serialization point (every test binary waits on it), so its
# build time is the cost that matters. 4 buys 16x fewer objects for about a
# second; 1 costs 63% for a reduction nothing needs. Whole-test-build time did
# not vary measurably: cargo already parallelizes across 98 separate crates, so
# intra-crate codegen parallelism is largely redundant here.
#
# `release` and `bench` keep their default of 16 — a throughput trade-off for
# generated code rather than a build-artifact one.
# Line tables instead of full DWARF (issue #269).
#
# Nothing in this repository's workflow inspects locals in a debugger; what it
# reads is panic backtraces, and `line-tables-only` keeps those complete —
# function names, files, and line numbers. What it drops is the type and
# variable description of every symbol, which for ~110 test binaries that each
# link this crate is a large share of the debug info emitted per build.
#
# Measured at `--all-features` from `cargo clean -p hdf5-pure` with the
# dependency graph already built, on a 10-core macOS host:
#
#                              full debug   line-tables-only
#   build this crate + tests    25.0/28.9s        16.6/16.8s
#   object files (1,357)            590 MiB           476 MiB
#   test binaries (130)            1.35 GiB          1.31 GiB
#   target/debug                   4.19 GiB          3.96 GiB
#
# The win is the ~40% off the build, not the disk. Emitting less debug info is
# less work by construction; the modest size figures are a macOS artifact and
# do not carry to Linux — Mach-O leaves DWARF in the object files and links a
# debug *map* into the executable, so a test binary here barely shrinks even as
# the objects behind it lose 19%. The statically linked libhdf5 inside every
# crosscheck binary is a further fixed weight this setting cannot touch.
#
# `[profile.test]` inherits `debug` from `[profile.dev]` — verified, not
# assumed: `cargo test -v` passes `-C debuginfo=line-tables-only` to all 130
# test targets. `codegen-units` is repeated below only because it already was.
# `release` and `bench` are untouched, so a backtrace from a release build is
# unaffected either way.
[profile.dev]
codegen-units = 4
debug = "line-tables-only"

[profile.test]
codegen-units = 4
