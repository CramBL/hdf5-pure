name: Interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Windows defaults to PowerShell.
defaults:
  run:
    shell: bash

jobs:
  # The test suite linking each release of the C library, and that release's
  # `h5dump` and `h5repack` on the fixtures. Each release is built from source
  # by `scripts/build_hdf5.py` and cached.
  hdf5:
    name: hdf5 / ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The last patch release of each series.
        version: ["1.8.23", "1.10.11", "1.12.3", "1.14.6", "2.2.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.version == '2.2.0' }}

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-nextest,just

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install zlib
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows

      - name: Cache the HDF5 build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/hdf5/${{ matrix.version }}
          key: hdf5-${{ matrix.version }}-${{ runner.os }}-${{ hashFiles('scripts/build_hdf5.py') }}

      - name: Build HDF5 ${{ matrix.version }}
        run: just hdf5-build ${{ matrix.version }}

      # A 1.8 library must reject the version 3 superblock of the 1.10 format.
      # Every later release must open it. The 1.8 format must open everywhere
      # and survive `h5repack`.
      - name: Check the format boundary with its tools
        run: |
          eval "$(just hdf5-env ${{ matrix.version }})"
          cargo run --locked --features serde --example libver_fixtures -- tmp/hdf5/fixtures
          case "${{ matrix.version }}" in
            1.8.*) reads_v110=false ;;
            *) reads_v110=true ;;
          esac
          failed=0
          for name in plain_v110.h5 mat_v110.mat; do
            if h5dump -n "tmp/hdf5/fixtures/$name" >/dev/null 2>&1; then opened=true; else opened=false; fi
            if [ "$opened" = "$reads_v110" ]; then
              echo "ok   $name: opened=$opened"
            else
              echo "FAIL $name: opened=$opened, expected $reads_v110"; failed=1
            fi
          done
          for name in plain_v18.h5 mat_v18.mat mat_string_v18.mat; do
            if h5dump -n "tmp/hdf5/fixtures/$name" >/dev/null 2>&1 \
               && h5repack "tmp/hdf5/fixtures/$name" "tmp/hdf5/fixtures/repacked-$name"; then
              echo "ok   $name: opened and repacked"
            else
              echo "FAIL $name: not opened or not repacked"; failed=1
            fi
          done
          exit $failed

      # The test suite linking this release. Failures do not fail the job.
      - name: Run the test suite against it
        continue-on-error: true
        run: |
          eval "$(just hdf5-env ${{ matrix.version }})"
          just test-external-hdf5 --features serde --no-fail-fast

  # The matrix must include the release `hdf5-metno` bundles, which the
  # crosschecks in `ci.yml` link.
  bundled-version:
    name: bundled version / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Check the matrix lists it
        run: |
          version="$(just hdf5-bundled-version)"
          echo "hdf5-metno bundles $version"
          if ! grep -qE "^\s+version: \[.*\"$version\".*\]" .github/workflows/interop.yml; then
            echo "::error::$version is not in the interop matrix version list."
            exit 1
          fi

  # The reference C library for MATLAB files, reading back what `mat` writes.
  # From conda-forge because the test calls `Mat_VarCreateStruct2`, which no
  # distribution package carries yet.
  matio:
    name: matio / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-nextest,just

      - name: Install conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: false
          activate-environment: matio
          miniconda-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Install libmatio
        run: conda install -y -c conda-forge libmatio

      # Naming the test binary keeps the job honest: the file is behind a `cfg`
      # on the feature, and nextest exits non-zero on "0 tests run".
      - name: Crosscheck against the reference library
        run: |
          export LIBRARY_PATH="$CONDA_PREFIX/lib:${LIBRARY_PATH:-}"
          export RUSTFLAGS="-C link-args=-Wl,-rpath,$CONDA_PREFIX/lib"
          just test-matio

  interop:
    name: interop
    runs-on: ubuntu-latest
    needs: [hdf5, bundled-version, matio]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
