name: Interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true
  RUST_BACKTRACE: 1

# Windows defaults to PowerShell.
defaults:
  run:
    shell: bash

jobs:
  # Whether the pull request touches what this workflow reads. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            run:
              - src/**
              - build.rs
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - scripts/python/pyproject.toml
              - scripts/python/uv.lock
              - scripts/python/src/hdf5_pure_scripts/__init__.py
              - scripts/python/src/hdf5_pure_scripts/build_hdf5.py
              - crates/**
              - tests/data/**
              - justfile
              - scripts/interop.just
              - scripts/constants.just
              - scripts/hdf5-releases.toml
              - .github/workflows/interop.yml

  # The releases scripts/hdf5-releases.toml lists, for the matrix below, and the newest of them.
  releases:
    name: releases
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    outputs:
      versions: ${{ steps.list.outputs.versions }}
      latest: ${{ steps.list.outputs.latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: List the releases
        id: list
        run: |
          echo "versions=$(just interop::hdf5-versions --json)" >> "$GITHUB_OUTPUT"
          echo "latest=$(just interop::hdf5-versions | tail -n 1)" >> "$GITHUB_OUTPUT"

  # The test suite linking each release of the C library. Each release is
  # built from source by `just interop::hdf5-build` and cached.
  hdf5:
    name: hdf5 / ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [changes, releases]
    if: needs.changes.outputs.run == 'true'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: ${{ fromJSON(needs.releases.outputs.versions) }}

    env:
      HDF5_VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.version == needs.releases.outputs.latest }}

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-nextest,just

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install zlib
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows

      - name: Cache the HDF5 build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/hdf5/${{ matrix.version }}
          key: hdf5-${{ matrix.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/python/src/hdf5_pure_scripts/build_hdf5.py', 'scripts/hdf5-releases.toml') }}

      - name: Build HDF5 ${{ matrix.version }}
        run: just interop::hdf5-build "$HDF5_VERSION"

      - name: Run the crosschecks against it
        run: just interop::test-hdf5 "$HDF5_VERSION" serde,ndarray --no-fail-fast

      # Clippy needs a libhdf5 to build against, so it runs here, once.
      - name: Lint the crosschecks
        if: matrix.os == 'ubuntu-latest' && matrix.version == needs.releases.outputs.latest
        run: just interop::lint-hdf5 "$HDF5_VERSION" serde,ndarray

  # The reference C library for MATLAB files, reading back what `mat` writes.
  # From conda-forge because the test calls `Mat_VarCreateStruct2`, which no
  # distribution package has yet.
  matio:
    name: matio / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.run == 'true'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-nextest,just

      - name: Install conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: false
          activate-environment: matio
          miniconda-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Install libmatio
        run: conda install -y -c conda-forge libmatio

      - name: Crosscheck against the reference library
        run: |
          export LIBRARY_PATH="$CONDA_PREFIX/lib:${LIBRARY_PATH:-}"
          export RUSTFLAGS="-C link-args=-Wl,-rpath,$CONDA_PREFIX/lib"
          just interop::test-matio

  ci-interop-guard:
    name: ci-interop-guard
    runs-on: ubuntu-latest
    needs: [changes, releases, hdf5, matio]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.run == 'true' && contains(needs.*.result, 'skipped'))
        run: exit 1
