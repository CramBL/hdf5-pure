name: Interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # What the C library makes of the files this crate writes, across the versions
  # a user is likely to have. conda-forge carries builds back to 1.8.16, and the
  # tools ship with them, so each entry is a real `h5dump` reading real output.
  hdf5:
    name: hdf5 / ${{ matrix.version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ["1.8.16", "1.8.20", "1.10.6", "1.12.2", "1.14.6", "2.2.0"]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.version == '1.14.6' }}

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "scripts/*.lock"

      - name: Install conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: false
          activate-environment: hdf5
          miniconda-version: latest

      - name: Install HDF5 ${{ matrix.version }}
        run: conda install -y -c conda-forge "hdf5=${{ matrix.version }}"

      - name: Check this crate's output against it
        run: just hdf5-compat --prefix "$CONDA_PREFIX"

  # 1.8.23 is the last 1.8 release and predates conda-forge's oldest build, so
  # the format boundary that `LibVer::V18` exists for is checked at its edge.
  hdf5-last-1_8:
    name: hdf5 / 1.8.23 (source)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "scripts/*.lock"

      - name: Cache the HDF5 1.8.23 build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/hdf5-compat-check/install
          key: hdf5-1_8_23-${{ runner.os }}-${{ hashFiles('scripts/check_hdf5_compat.py') }}

      - name: Check this crate's output against it
        run: just hdf5-compat

  # The reference C library for MATLAB files, reading back what `mat` writes.
  # From conda-forge because the test calls `Mat_VarCreateStruct2`, which no
  # distribution package carries yet.
  matio:
    name: matio / ubuntu-latest
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-nextest,just

      - name: Install conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: false
          activate-environment: matio
          miniconda-version: latest

      - name: Install libmatio
        run: conda install -y -c conda-forge libmatio

      # Naming the test binary keeps the job honest: the file is behind a `cfg`
      # on the feature, and nextest exits non-zero on "0 tests run".
      - name: Crosscheck against the reference library
        run: |
          export LIBRARY_PATH="$CONDA_PREFIX/lib:${LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          just test-matio

  interop:
    name: interop
    runs-on: ubuntu-latest
    needs: [hdf5, hdf5-last-1_8, matio]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
