name: Interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # What the C library makes of the files this crate writes, across the versions
  # a user is likely to have. conda-forge carries builds back to 1.8.16, and the
  # tools ship with them, so each entry is a real `h5dump` reading real output.
  hdf5:
    name: hdf5 / ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The last release of each series conda-forge carries.
        version: ["1.8.20", "1.10.6", "1.12.2", "1.14.6", "2.2.0"]
        exclude:
          # conda-forge's oldest build for Apple Silicon is 1.10.6, and its
          # Windows 1.8 build wants a `vc ==14` package only the retired
          # defaults channel carries. The source job below covers 1.8 on macOS.
          - {os: macos-latest, version: "1.8.20"}
          - {os: windows-latest, version: "1.8.20"}

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.version == '1.14.6' }}

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-nextest,just

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "scripts/*.lock"
          cache-suffix: hdf5-${{ matrix.version }}

      - name: Install conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: false
          activate-environment: hdf5
          miniconda-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Install HDF5 ${{ matrix.version }}
        run: conda install -y -c conda-forge "hdf5=${{ matrix.version }}" "python>=3.9,<3.12"

      # cygpath: bash eats the backslashes in a Windows $CONDA_PREFIX.
      - name: Resolve the prefix
        run: |
          prefix="$CONDA_PREFIX"
          if command -v cygpath >/dev/null; then prefix="$(cygpath -u "$prefix")"; fi
          echo "HDF5_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Build h5py against it
        run: just hdf5-build --prefix "$HDF5_PREFIX"

      - name: Check this crate's output against it
        run: just hdf5-check --prefix "$HDF5_PREFIX"

      # The test suite with `hdf5-metno` linking this library instead of the
      # bundled one. Failures are reported and do not fail the job.
      #
      # HDF5_DIR is set on this step only, so the fixture writer above links
      # the bundled library. `hdf5-metno-sys` declares HDF5_DIR as a build
      # script input only when it links a system library, so a bundled build
      # from the cache is cleaned to make the script run again.
      #
      # The runtime library path is set through the loader on Linux and
      # Windows. macOS takes an rpath through RUSTFLAGS, which replaces the
      # flags in `.cargo/config.toml`; that file sets none for aarch64.
      - name: Run the test suite against it
        continue-on-error: true
        run: |
          dir="$CONDA_PREFIX"
          case "$RUNNER_OS" in
            Windows) dir="$(cygpath -m "$dir")" ;;
            Linux) export LD_LIBRARY_PATH="$dir/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ;;
            macOS) export RUSTFLAGS="-C link-args=-Wl,-rpath,$dir/lib" ;;
          esac
          export HDF5_DIR="$dir"
          cargo clean -p hdf5-metno-sys
          just test --features serde --no-fail-fast

  # The matrix must include the release `hdf5-metno` bundles, which is the
  # library the crosschecks in `ci.yml` link.
  bundled-version:
    name: bundled version / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Check the matrix lists it
        run: |
          version="$(just hdf5-bundled-version)"
          echo "hdf5-metno bundles $version"
          if ! grep -qE "^\s+version: \[.*\"$version\".*\]" .github/workflows/interop.yml; then
            echo "::error::$version is not in the interop matrix version list."
            exit 1
          fi

  # 1.8.23 is the last 1.8 release and predates conda-forge's oldest build, so
  # the format boundary that `LibVer::V18` exists for is checked at its edge.
  hdf5-last-1_8:
    name: hdf5 / 1.8.23 (source) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "scripts/*.lock"

      - name: Cache the HDF5 1.8.23 build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/hdf5-compat-check/install
          key: hdf5-1_8_23-${{ runner.os }}-${{ hashFiles('scripts/check_hdf5_compat.py') }}

      - name: Build HDF5 1.8.23, and h5py against it
        run: just hdf5-build

      - name: Check this crate's output against it
        run: just hdf5-check

  # The reference C library for MATLAB files, reading back what `mat` writes.
  # From conda-forge because the test calls `Mat_VarCreateStruct2`, which no
  # distribution package carries yet.
  matio:
    name: matio / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-nextest,just

      - name: Install conda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: false
          activate-environment: matio
          miniconda-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Install libmatio
        run: conda install -y -c conda-forge libmatio

      # Naming the test binary keeps the job honest: the file is behind a `cfg`
      # on the feature, and nextest exits non-zero on "0 tests run".
      - name: Crosscheck against the reference library
        run: |
          export LIBRARY_PATH="$CONDA_PREFIX/lib:${LIBRARY_PATH:-}"
          export RUSTFLAGS="-C link-args=-Wl,-rpath,$CONDA_PREFIX/lib"
          just test-matio

  interop:
    name: interop
    runs-on: ubuntu-latest
    needs: [hdf5, bundled-version, hdf5-last-1_8, matio]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
