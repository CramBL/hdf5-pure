name: Interop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true
  RUST_BACKTRACE: 1

# Windows defaults to PowerShell.
defaults:
  run:
    shell: bash

jobs:
  # Whether the pull request touches what this workflow reads. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
      matio-image: ${{ steps.filter.outputs.matio-image == 'true' }}
    steps:
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            run:
              - src/**
              - build.rs
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - .config/nextest.toml
              - scripts/python/pyproject.toml
              - scripts/python/uv.lock
              - scripts/python/src/hdf5_pure_scripts/__init__.py
              - scripts/python/src/hdf5_pure_scripts/build_hdf5.py
              - crates/**
              - tests/data/**
              - justfile
              - scripts/interop.just
              - scripts/constants.just
              - scripts/hdf5-releases.toml
              - .github/workflows/interop.yml
              - ci/matio.env
              - docker/ci/matio/**
              - scripts/ci/matio-image.sh
              - scripts/ci/run-matio.sh
              - scripts/ci/install-mold.sh
              - .github/workflows/ci-images.yml
            matio-image:
              - ci/matio.env
              - rust-toolchain.toml
              - docker/ci/matio/**
              - scripts/ci/matio-image.sh
              - scripts/ci/install-mold.sh

  # The releases scripts/hdf5-releases.toml lists, for the matrix below, and the newest of them.
  releases:
    name: releases
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    outputs:
      versions: ${{ steps.list.outputs.versions }}
      latest: ${{ steps.list.outputs.latest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: List the releases
        id: list
        run: |
          echo "versions=$(just interop::hdf5-versions --json)" >> "$GITHUB_OUTPUT"
          echo "latest=$(just interop::hdf5-versions | tail -n 1)" >> "$GITHUB_OUTPUT"

  # The test suite linking each release of the C library. Each release is
  # built from source by `just interop::hdf5-build` and cached.
  hdf5:
    name: hdf5 / ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [changes, releases]
    if: needs.changes.outputs.run == 'true'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: ${{ fromJSON(needs.releases.outputs.versions) }}

    env:
      CROSSCHECK_FEATURES: serde,ndarray
      HDF5_VERSION: ${{ matrix.version }}
      NEXTEST_NO_TESTS: pass
      NEXTEST_PROFILE: ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.version == needs.releases.outputs.latest }}

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148,just@1.59.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # vcpkg selects binary archives by the port, triplet, compiler, and configuration ABI.
      - name: Configure the zlib binary cache
        if: runner.os == 'Windows'
        id: zlib
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          $revision = git -C $root rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executable = (Get-FileHash "$root/vcpkg.exe" -Algorithm SHA256).Hash
          $cache = "$env:RUNNER_TEMP/vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "identity=$revision-$executable-$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "path=$cache" >> $env:GITHUB_OUTPUT
          Write-Output "vcpkg revision: $revision; runner image: $env:ImageVersion"
          & "$root/vcpkg.exe" version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore the zlib binary cache
        if: runner.os == 'Windows'
        id: zlib-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.zlib.outputs.path }}
          key: vcpkg-zlib-x64-windows-${{ runner.arch }}-${{ steps.zlib.outputs.identity }}-${{ hashFiles('.github/workflows/interop.yml') }}

      - name: Install zlib
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/zlib/vcpkg_abi_info.txt"

      - name: Save the zlib binary cache
        if: >-
          runner.os == 'Windows' &&
          github.repository == 'CramBL/hdf5-pure' &&
          github.ref == 'refs/heads/main' &&
          matrix.version == needs.releases.outputs.latest &&
          steps.zlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.zlib.outputs.path }}
          key: ${{ steps.zlib-cache.outputs.cache-primary-key }}

      - name: Cache the HDF5 build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/hdf5/${{ matrix.version }}
          key: hdf5-${{ matrix.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/python/src/hdf5_pure_scripts/build_hdf5.py', 'scripts/hdf5-releases.toml') }}

      - name: Build HDF5 ${{ matrix.version }}
        run: just interop::hdf5-build "$HDF5_VERSION"

      - name: Crosscheck — file space
        if: ${{ !cancelled() }}
        run: just interop::test-hdf5-group "$HDF5_VERSION" file-space "$CROSSCHECK_FEATURES"

      - name: Crosscheck — append
        if: ${{ !cancelled() }}
        run: just interop::test-hdf5-group "$HDF5_VERSION" append "$CROSSCHECK_FEATURES"

      - name: Crosscheck — attributes
        if: ${{ !cancelled() }}
        run: just interop::test-hdf5-group "$HDF5_VERSION" attributes "$CROSSCHECK_FEATURES"

      - name: Crosscheck — storage
        if: ${{ !cancelled() }}
        run: just interop::test-hdf5-group "$HDF5_VERSION" storage "$CROSSCHECK_FEATURES"

      - name: Crosscheck — editing
        if: ${{ !cancelled() }}
        run: just interop::test-hdf5-group "$HDF5_VERSION" editing "$CROSSCHECK_FEATURES"

      - name: Crosscheck — types
        if: ${{ !cancelled() }}
        run: just interop::test-hdf5-group "$HDF5_VERSION" types "$CROSSCHECK_FEATURES"

      - name: Crosscheck — compatibility
        if: ${{ !cancelled() }}
        run: just interop::test-hdf5-group "$HDF5_VERSION" compat "$CROSSCHECK_FEATURES"

      - name: Crosscheck — other
        if: ${{ !cancelled() }}
        run: just interop::test-hdf5-group "$HDF5_VERSION" @global "$CROSSCHECK_FEATURES"

      # Clippy needs a libhdf5 to build against, so it runs here, once.
      - name: Lint the crosschecks
        if: matrix.os == 'ubuntu-latest' && matrix.version == needs.releases.outputs.latest
        run: just interop::lint-hdf5 "$HDF5_VERSION" "$CROSSCHECK_FEATURES"

  # libhdf5 for MATLAB files, reading back what `mat` writes.
  # From conda-forge because the test calls `Mat_VarCreateStruct2`, which no
  # distribution package has yet.
  matio:
    name: matio / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.run == 'true'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        if: matrix.os != 'ubuntu-latest'
        run: rustup toolchain install

      - name: Select the matio image
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        id: image
        env:
          CONSTRUCTION_CHANGED: ${{ needs.changes.outputs.matio-image }}
        run: |
          candidate=false
          image=$(bash scripts/ci/matio-image.sh reference)
          if [[ "$CONSTRUCTION_CHANGED" == true ]] || ! docker pull "$image"; then
            candidate=true
            image="hdf5-pure-matio:candidate"
            bash scripts/ci/matio-image.sh build "$image"
          fi
          identity=$(docker image inspect --format '{{.Id}}' "$image" | cut -d: -f2)
          printf 'Matio image: %s\nCache identity: %s\n' "$image" "$identity"
          {
            echo "MATIO_IMAGE=$image"
            echo "CARGO_HOME=$GITHUB_WORKSPACE/../matio-cargo"
            echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target/matio-$identity"
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc'
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C force-frame-pointers=yes -C link-arg=-fuse-ld=mold -C link-arg=-Wl,-rpath,/opt/matio/lib'
          } >> "$GITHUB_ENV"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "Local build: $candidate"

      - name: Cache the matio Cargo environment
        if: matrix.os == 'ubuntu-latest'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: matio-${{ steps.image.outputs.identity }}-${{ hashFiles('scripts/ci/run-matio.sh') }}
          cmd-format: env -u CARGO_ENCODED_RUSTFLAGS bash scripts/ci/run-matio.sh {0}
          cache-bin: false
          workspaces: . -> target/matio-${{ steps.image.outputs.identity }}
          cache-targets: ${{ steps.image.outputs.candidate != 'true' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Crosscheck in the matio image
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/ci/run-matio.sh just interop::test-matio

      - name: Cache Cargo
        if: matrix.os != 'ubuntu-latest'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: interop
          save-if: false

      - name: Install tools
        if: matrix.os != 'ubuntu-latest'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148,just@1.59.0

      - name: Install conda
        if: matrix.os != 'ubuntu-latest'
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          auto-update-conda: false
          activate-environment: matio
          miniconda-version: latest
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Install libmatio
        if: matrix.os != 'ubuntu-latest'
        run: conda install -y -c conda-forge libmatio

      - name: Crosscheck against the reference library
        if: matrix.os != 'ubuntu-latest'
        run: |
          export LIBRARY_PATH="$CONDA_PREFIX/lib:${LIBRARY_PATH:-}"
          export RUSTFLAGS="-C link-args=-Wl,-rpath,$CONDA_PREFIX/lib"
          just interop::test-matio

  ci-interop-guard:
    name: ci-interop-guard
    runs-on: ubuntu-latest
    needs: [changes, releases, hdf5, matio]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.run == 'true' && contains(needs.*.result, 'skipped'))
        run: exit 1
