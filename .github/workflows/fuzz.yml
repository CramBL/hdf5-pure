name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    # GitHub schedules are evaluated in UTC.
    - cron: '39 3 * * 5'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true
  FUZZ_DURATION: 600

jobs:
  # Whether the pull request touches what this workflow reads. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            run:
              - src/**
              - build.rs
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - fuzz/**
              - justfile
              - scripts/fuzz.just
              - .github/workflows/fuzz.yml

  cargo-fuzz:
    name: Fuzz (cargo-fuzz)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # The scheduled run files an issue for a crash.
    permissions:
      contents: read
      issues: write

    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cargo-fuzz
      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-fuzz,just
      - name: Use PR smoke duration
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo "FUZZ_DURATION=30" >> "${GITHUB_ENV}"
      - name: Run every fuzz target
        run: just fuzz::fuzz-all "$FUZZ_DURATION"
      # To reproduce a crash, download fuzz-artifacts and run:
      # cargo +nightly fuzz run <target> fuzz/artifacts/<target>/<crash-file> --target x86_64-unknown-linux-gnu -- -rss_limit_mb=4096
      - name: Upload crash artifacts
        id: upload-crash-artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 14
          if-no-files-found: ignore
      - name: Create scheduled failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_URL: ${{ steps.upload-crash-artifacts.outputs.artifact-url }}
        run: |
          set -euo pipefail

          {
            echo "Weekly fuzzing failed."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [[ -n "${ARTIFACT_URL}" ]]; then
              echo "Fuzz artifacts: ${ARTIFACT_URL}"
            fi
            echo
            echo "To reproduce, download and extract fuzz-artifacts at the repo root, then run:"
            echo
            echo '```sh'
            echo 'cargo +nightly fuzz run <target> fuzz/artifacts/<target>/<crash-file> --target x86_64-unknown-linux-gnu -- -rss_limit_mb=4096'
            echo '```'
          } > issue.md

          gh issue create \
            --title "Scheduled fuzzing failed" \
            --body-file issue.md \
            --label bug
