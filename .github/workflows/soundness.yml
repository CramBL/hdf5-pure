name: Soundness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true
  RUST_BACKTRACE: 1

jobs:
  # Whether the pull request touches what this workflow reads. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            run:
              - src/**
              - crates/**
              - build.rs
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - .config/nextest.toml
              - tests/allocation_baseline.rs
              - tests/baselines/**
              - justfile
              - scripts/constants.just
              - scripts/soundness.just
              - .github/workflows/soundness.yml

  # Undefined behaviour in the selected unsafe and high-risk paths `just soundness::miri` runs.
  # Too slow for pull requests, so it runs on `main`, by schedule and on dispatch.
  miri:
    name: miri / ubuntu-latest
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    env:
      MIRIFLAGS: -Zmiri-strict-provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the Miri image
        id: image
        run: |
          candidate=false
          image=$(bash scripts/ci/miri-image.sh reference)
          if ! docker pull "$image"; then
            candidate=true
            image="hdf5-pure-miri:candidate"
            bash scripts/ci/miri-image.sh build "$image"
          fi
          identity=$(docker image inspect --format '{{.Id}}' "$image" | cut -d: -f2)
          printf 'Miri image: %s\nCache identity: %s\n' "$image" "$identity"
          {
            echo "MIRI_IMAGE=$image"
            echo "CARGO_HOME=$GITHUB_WORKSPACE/../miri-cargo"
          } >> "$GITHUB_ENV"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "Local build: $candidate"
          echo "pin=$(cat scripts/nightly.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache the Miri Cargo environment
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: miri-${{ steps.image.outputs.identity }}-${{ hashFiles('scripts/ci/run-miri.sh', 'scripts/soundness.just') }}
          cmd-format: env -u CARGO_ENCODED_RUSTFLAGS bash scripts/ci/run-miri.sh {0}
          cache-bin: false
          cache-targets: ${{ steps.image.outputs.candidate != 'true' }}
          workspaces: . -> target/${{ steps.image.outputs.pin }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Miri
        run: bash scripts/ci/run-miri.sh just soundness::miri

  # The exact allocation figures under `tests/baselines/`. One host and one
  # feature set, because an exact count is a property of both; the scaling
  # rules run everywhere in the `test` matrix. The figures are tied to the
  # toolchain, which `rust-toolchain.toml` pins.
  heap-baseline:
    name: heap baseline / ubuntu x86_64
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: heap-baseline
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148,just@1.59.0

      - name: Check the recorded figures
        run: just soundness::heap-baseline

  ci-soundness-guard:
    name: ci-soundness-guard
    runs-on: ubuntu-latest
    needs: [changes, miri, heap-baseline]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.run == 'true' && needs.heap-baseline.result == 'skipped')
          || (github.event_name != 'pull_request' && needs.miri.result == 'skipped')
        run: exit 1
