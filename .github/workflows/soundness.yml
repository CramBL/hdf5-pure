name: Soundness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true
  RUST_BACKTRACE: 1

jobs:
  # Whether the pull request touches what this workflow reads. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
      miri-image: ${{ steps.filter.outputs.miri-image }}
      miri-adoption: ${{ steps.filter.outputs.miri-adoption }}
    steps:
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            run:
              - src/**
              - crates/**
              - build.rs
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - .config/nextest.toml
              - tests/allocation_baseline.rs
              - tests/baselines/**
              - justfile
              - scripts/constants.just
              - scripts/nightly.txt
              - scripts/soundness.just
              - .github/workflows/soundness.yml
              - ci/miri.env
              - ci/miri-image.txt
              - docker/ci/miri/**
              - scripts/ci/miri-image.sh
              - scripts/ci/run-miri.sh
              - .github/workflows/ci-images.yml
            miri-image:
              - ci/miri.env
              - scripts/nightly.txt
              - docker/ci/miri/**
              - scripts/ci/miri-image.sh
              - scripts/ci/run-miri.sh
              - scripts/soundness.just
              - .github/workflows/ci-images.yml
            miri-adoption:
              - ci/miri-image.txt

  # Undefined behaviour in the selected unsafe and high-risk paths `just soundness::miri` runs.
  miri:
    name: miri / ubuntu-latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    env:
      MIRIFLAGS: -Zmiri-strict-provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Miri candidate
        id: image
        if: needs.changes.outputs.miri-image == 'true'
        env:
          ADOPTION_CHANGED: ${{ needs.changes.outputs.miri-adoption }}
        run: |
          if [[ "$ADOPTION_CHANGED" == true ]]; then
            echo 'Change Miri construction and adoption in separate PRs' >&2
            exit 1
          fi
          identity=$(bash scripts/ci/miri-image.sh fingerprint)
          image="hdf5-pure-miri:$identity"
          bash scripts/ci/miri-image.sh build "$image"
          identity=$(docker image inspect --format '{{.Id}}' "$image" | cut -d: -f2)
          {
            echo "MIRI_IMAGE=$image"
            echo "CARGO_HOME=$GITHUB_WORKSPACE/../miri-cargo"
          } >> "$GITHUB_ENV"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "pin=$(cat scripts/nightly.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache the candidate Cargo environment
        if: needs.changes.outputs.miri-image == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: miri-${{ steps.image.outputs.identity }}-${{ hashFiles('scripts/ci/run-miri.sh', 'scripts/soundness.just') }}
          cmd-format: env -u CARGO_ENCODED_RUSTFLAGS bash scripts/ci/run-miri.sh {0}
          cache-bin: false
          cache-targets: false
          workspaces: . -> target/${{ steps.image.outputs.pin }}
          save-if: false

      - name: Install Rust
        if: needs.changes.outputs.miri-image != 'true'
        run: rustup toolchain install

      - name: Cache Cargo
        if: needs.changes.outputs.miri-image != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: miri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        if: needs.changes.outputs.miri-image != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0

      - name: Install the Miri toolchain
        if: needs.changes.outputs.miri-image != 'true'
        run: just soundness::miri-toolchain

      - name: Miri
        run: |
          if [[ -n "${MIRI_IMAGE:-}" ]]; then
            bash scripts/ci/run-miri.sh just soundness::miri
          else
            just soundness::miri
          fi

  # The exact allocation figures under `tests/baselines/`. One host and one
  # feature set, because an exact count is a property of both; the scaling
  # rules run everywhere in the `test` matrix. The figures are tied to the
  # toolchain, which `rust-toolchain.toml` pins.
  heap-baseline:
    name: heap baseline / ubuntu x86_64
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: heap-baseline
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148,just@1.59.0

      - name: Check the recorded figures
        run: just soundness::heap-baseline

  ci-soundness-guard:
    name: ci-soundness-guard
    runs-on: ubuntu-latest
    needs: [changes, miri, heap-baseline]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.run == 'true' && contains(needs.*.result, 'skipped'))
        run: exit 1
