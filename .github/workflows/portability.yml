name: Portability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true
  RUST_BACKTRACE: 1

jobs:
  # Whether the pull request touches what this workflow reads. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
      images: ${{ steps.filter.outputs.images == 'true' }}
      adoption: ${{ steps.filter.outputs.adoption == 'true' }}
    steps:
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            run:
              - src/**
              - build.rs
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - tests/**
              - crates/hdf5-pure-core/**
              - crates/hdf5-pure-filter/**
              - crates/hdf5-pure-format/**
              - crates/hdf5-pure-space/**
              - crates/test-util/**
              - crates/test-util-hdf5/**
              - crates/crosscheck/**
              - crates/wasm-test/**
              - Cross.toml
              - justfile
              - scripts/constants.just
              - scripts/portability.just
              - .github/workflows/portability.yml
              - ci/images.toml
              - docker/ci/cross/**
              - scripts/ci/**
              - .github/workflows/ci-images.yml
            images:
              - ci/images.toml
              - docker/ci/cross/**
              - scripts/ci/install-mold.sh
              - scripts/ci/cross-image.sh
            adoption:
              - Cross.toml

  # The builds this job checks without running them (WASM, bare metal, a std
  # host with no default features), Clippy over the wasm32 tests, then two
  # lints on i686. The library
  # indexes its in-memory image with `usize`, so a 64-bit offset narrowed on a
  # 32-bit target would read the wrong bytes (issue #27). And each narrowing
  # cast is either routed through `crate::convert` or annotated with an
  # `#[expect]` stating why it cannot lose information (issue #72); the flagged
  # set is tied to the clippy version, which `rust-toolchain.toml` pins.
  checks:
    name: checks / ubuntu-latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add i686-unknown-linux-gnu wasm32-unknown-unknown thumbv7em-none-eabi

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: portability
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0

      - name: Build targets and i686 lints
        run: just portability

  # QEMU, for the two properties no native runner has: a 32-bit pointer width,
  # and a big-endian host where `from_ne_bytes` and `from_le_bytes` differ. The
  # `-hdf5` recipes repeat this linking libhdf5, `cross`
  # building it from source for the target.
  qemu:
    name: test / ${{ matrix.name }} (qemu)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: "2"
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"

    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: i686, family: i686, recipe: portability::test-32bit}
          - {name: s390x, family: s390x, recipe: portability::test-big-endian}
          - {name: i686-hdf5, family: i686, recipe: portability::test-32bit-hdf5}
          - {name: s390x-hdf5, family: s390x, recipe: portability::test-big-endian-hdf5}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Select the cross image
        id: image
        env:
          FAMILY: ${{ matrix.family }}
          CONSTRUCTION_CHANGED: ${{ needs.changes.outputs.images }}
          ADOPTION_CHANGED: ${{ needs.changes.outputs.adoption }}
        run: bash scripts/ci/select-cross-image.sh "$FAMILY" "$CONSTRUCTION_CHANGED" "$ADOPTION_CHANGED"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: portability-${{ matrix.name }}-${{ steps.image.outputs.identity }}
          cache-targets: ${{ steps.image.outputs.candidate != 'true' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cross@0.2.5,just@1.59.0

      - name: Tests
        env:
          RECIPE: ${{ matrix.recipe }}
          CI_CROSS_CANDIDATE: ${{ steps.image.outputs.candidate }}
        run: |
          unset HDF5_DIR
          just "$RECIPE"

  # The wasm32 tests under Node, with the `wasm-bindgen-test-runner` of the
  # wasm-bindgen release `Cargo.lock` pins.
  wasm:
    name: test / wasm32 (node)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: portability-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install just
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0

      - name: Read the pinned wasm-bindgen release
        id: wasm-bindgen
        run: echo "version=$(just portability::wasm-bindgen-version)" >> "$GITHUB_OUTPUT"

      - name: Install the wasm-bindgen test runner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Tests
        run: just portability::test-wasm

  ci-portability-guard:
    name: ci-portability-guard
    runs-on: ubuntu-latest
    needs: [changes, checks, qemu, wasm]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.run == 'true' && contains(needs.*.result, 'skipped'))
        run: exit 1
