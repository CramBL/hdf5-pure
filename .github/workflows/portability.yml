name: Portability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true
  RUST_BACKTRACE: 1

jobs:
  # Whether the pull request touches what this workflow reads. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            run:
              - src/**
              - build.rs
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - tests/**
              - crates/test-util/**
              - justfile
              - scripts/portability.just
              - .github/workflows/portability.yml

  # The targets the crate must build for without running (wasm, bare metal, a
  # std host with no default features), then two lints on i686. The library
  # indexes its in-memory image with `usize`, so a 64-bit offset narrowed on a
  # 32-bit target would read the wrong bytes (issue #27). And each narrowing
  # cast is either routed through `crate::convert` or annotated with an
  # `#[expect]` stating why it cannot lose information (issue #72); the flagged
  # set is tied to the clippy version, which `rust-toolchain.toml` pins.
  checks:
    name: checks / ubuntu-latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add i686-unknown-linux-gnu wasm32-unknown-unknown thumbv7em-none-eabi

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: portability
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Build targets and i686 lints
        run: just portability

  # QEMU, for the two properties no native runner has: a 32-bit pointer width,
  # and a big-endian host where `from_ne_bytes` and `from_le_bytes` differ.
  qemu:
    name: test / ${{ matrix.name }} (qemu)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: i686, recipe: portability::test-32bit}
          - {name: s390x, recipe: portability::test-big-endian}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: portability-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cross,just

      - name: Tests
        run: just ${{ matrix.recipe }}

  ci-portability-guard:
    name: ci-portability-guard
    runs-on: ubuntu-latest
    needs: [changes, checks, qemu]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.run == 'true' && contains(needs.*.result, 'skipped'))
        run: exit 1
