name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true
  RUST_BACKTRACE: 1

jobs:
  # Whether the pull request touches what this workflow reads. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            run:
              - src/**
              - docs/**
              - build.rs
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - .config/nextest.toml
              - tests/**
              - examples/**
              - benches/**
              - crates/**
              - justfile
              - scripts/nightly.txt
              - scripts/constants.just
              - scripts/ci/**
              - .github/workflows/ci.yml

  # The crate's own suite. The crosschecks against libhdf5
  # are the interop workflow's.
  test:
    name: test / ${{ matrix.os }} / ${{ matrix.config.name }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    env:
      # Keep unused Rust versions out of the cache compiler identity.
      RUSTUP_HOME: ${{ github.workspace }}/../rustup

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config:
          - name: default
          - name: full

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --profile minimal

      - name: Enable optimized tests with debug checks
        if: matrix.os == 'ubuntu-latest' && matrix.config.name == 'default'
        shell: bash
        run: |
          {
            echo 'CARGO_PROFILE_TEST_OPT_LEVEL=1'
            echo 'CARGO_PROFILE_TEST_DEBUG_ASSERTIONS=true'
            echo 'CARGO_PROFILE_TEST_OVERFLOW_CHECKS=true'
            echo 'CARGO_PROFILE_TEST_LTO=off'
          } >> "$GITHUB_ENV"

      - name: Install and select mold
        id: mold
        if: matrix.os == 'ubuntu-latest' && matrix.config.name == 'default'
        shell: bash
        run: |
          for variable in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTDOCFLAGS CARGO_ENCODED_RUSTDOCFLAGS; do
            if [[ -v "$variable" ]]; then
              echo "::error::$variable overrides the target flags."
              exit 1
            fi
          done
          bash scripts/ci/install-mold.sh "$RUNNER_TEMP/mold"
          echo "$RUNNER_TEMP/mold/bin" >> "$GITHUB_PATH"
          echo "identity=$(bash scripts/ci/install-mold.sh --identity)" >> "$GITHUB_OUTPUT"
          {
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc'
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C force-frame-pointers=yes -C link-arg=-fuse-ld=mold'
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTDOCFLAGS=-C link-arg=-fuse-ld=mold'
          } >> "$GITHUB_ENV"

      # Main writes each cache group from a compatible test configuration.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.os == 'ubuntu-latest' && matrix.config.name == 'default' && format('ci-test-opt1-{0}', steps.mold.outputs.identity) || 'ci' }}
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.config.name == 'full' || matrix.os == 'ubuntu-latest') }}
          cache-on-failure: true

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148,cargo-hack,just@1.59.0

      - name: Tests
        run: just ${{ matrix.config.name == 'full' && 'test-full' || 'test' }}

      # rustdoc compiles doctests, so nextest cannot run them.
      - name: Doctests
        run: just ${{ matrix.config.name == 'full' && 'doctest-full' || 'doctest' }}

  # Tests each feature in `FULL_PUBLIC_FEATURES` beside the defaults.
  feature-tests:
    name: feature tests / ubuntu-latest / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --profile minimal

      - name: Enable optimized tests with debug checks
        shell: bash
        run: |
          {
            echo 'CARGO_PROFILE_TEST_OPT_LEVEL=1'
            echo 'CARGO_PROFILE_TEST_DEBUG_ASSERTIONS=true'
            echo 'CARGO_PROFILE_TEST_OVERFLOW_CHECKS=true'
            echo 'CARGO_PROFILE_TEST_LTO=off'
          } >> "$GITHUB_ENV"

      - name: Install and select mold
        id: mold
        shell: bash
        run: |
          for variable in RUSTFLAGS CARGO_ENCODED_RUSTFLAGS RUSTDOCFLAGS CARGO_ENCODED_RUSTDOCFLAGS; do
            if [[ -v "$variable" ]]; then
              echo "::error::$variable overrides the target flags."
              exit 1
            fi
          done
          bash scripts/ci/install-mold.sh "$RUNNER_TEMP/mold"
          echo "$RUNNER_TEMP/mold/bin" >> "$GITHUB_PATH"
          echo "identity=$(bash scripts/ci/install-mold.sh --identity)" >> "$GITHUB_OUTPUT"
          {
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc'
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C force-frame-pointers=yes -C link-arg=-fuse-ld=mold'
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTDOCFLAGS=-C link-arg=-fuse-ld=mold'
          } >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ format('ci-test-opt1-{0}', steps.mold.outputs.identity) }}
          save-if: false
          cache-on-failure: true

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148,cargo-hack,just@1.59.0

      - name: Tests and doctests, each optional feature alone
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          features_text="$(just --evaluate FULL_PUBLIC_FEATURES)"
          IFS=',' read -r -a features <<< "$features_text"
          shard_features=()
          for ((index = SHARD_INDEX; index < ${#features[@]}; index += SHARD_COUNT)); do
            shard_features+=("${features[index]}")
          done
          if (( ${#shard_features[@]} == 0 )); then
            exit 0
          fi
          cargo hack -p hdf5-pure --each-feature --include-features "$(IFS=,; echo "${shard_features[*]}")" --exclude-no-default-features --features default nextest run --locked
          cargo hack -p hdf5-pure --each-feature --include-features "$(IFS=,; echo "${shard_features[*]}")" --exclude-no-default-features --features default test --locked --doc

  lint:
    name: lint / ubuntu-latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --profile minimal

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0

      - name: Formatting
        run: just fmt-check

      - name: Clippy
        run: just clippy-full

      # A debug build hides two things: `debug_assert!` still type-checks its
      # argument in release (issue #288), and `--release`-only lints never fire.
      - name: Check (release)
        run: just check-release

      - name: Rustdoc
        run: just doc

      - name: Cargo.lock is current
        run: cargo update --workspace --locked

      # Each example ends in assertions, so running them tests the public API.
      # Clippy above built them with the same features.
      - name: Run every example
        run: just examples

  feature-topology:
    name: feature topology / ubuntu-latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal
          rustup target add thumbv7em-none-eabi

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack,just@1.59.0

      - name: Clippy, public feature pairs
        run: just clippy-feature-powerset

      - name: Clippy, no_std feature powerset
        run: just clippy-no-std-feature-powerset

  # The published documentation as docs.rs builds it.
  docs-rs:
    name: docs.rs / ubuntu-latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    env:
      RUSTUP_HOME: ${{ github.workspace }}/../rustup

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --profile minimal

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docs-rs
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0

      - name: Install the pinned nightly
        run: just nightly

      - name: Rustdoc
        run: just docs-rs

  ci-ci-guard:
    name: ci-ci-guard
    runs-on: ubuntu-latest
    needs: [changes, test, feature-tests, lint, feature-topology, docs-rs]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.run == 'true' && contains(needs.*.result, 'skipped'))
        run: exit 1
