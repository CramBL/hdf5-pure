name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The crosschecks link the libhdf5 `hdf5-metno` bundles, which the interop
  # workflow names and also builds from source beside the older releases.
  test:
    name: test / ${{ matrix.os }} / ${{ matrix.config.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config:
          - name: default
            flags: ""
          - name: full
            flags: --features "serde zfp fast-deflate provenance ndarray"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      # Writer for the `ci` group: the widest dependency set in this workflow.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.config.name == 'full' }}
          cache-on-failure: true

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-nextest,cargo-hack,just

      - name: Tests
        run: cargo nextest run --locked --features __hdf5-bundled ${{ matrix.config.flags }}

      # rustdoc compiles doctests, so nextest cannot run them.
      - name: Doctests
        run: cargo test --locked --doc --features __hdf5-bundled ${{ matrix.config.flags }}

      # Subsets of `full`, on one host: a feature that only compiles beside
      # another surfaces here.
      - name: Tests, each optional feature alone
        if: matrix.os == 'ubuntu-latest' && matrix.config.name == 'default'
        run: just test-each-feature

      - name: Doctests, each optional feature alone
        if: matrix.os == 'ubuntu-latest' && matrix.config.name == 'default'
        run: just doctest-each-feature

  lint:
    name: lint / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Formatting
        run: just fmt-check

      - name: Clippy
        run: just clippy

      # A debug build hides two things: `debug_assert!` still type-checks its
      # argument in release (issue #288), and `--release`-only lints never fire.
      - name: Check (release)
        run: just check-release

      - name: Rustdoc
        run: just doc

      - name: Cargo.lock is current
        run: cargo update --workspace --locked

      # Each example ends in assertions, so running them tests the public API.
      # Clippy above built them with the same features.
      - name: Run every example
        run: just examples

  ci-ci-guard:
    name: ci-ci-guard
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
