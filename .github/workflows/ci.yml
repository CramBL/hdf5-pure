name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true
  RUST_BACKTRACE: 1

jobs:
  # Whether the pull request touches what this workflow reads. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            run:
              - src/**
              - build.rs
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - .cargo/**
              - tests/**
              - examples/**
              - benches/**
              - crates/test-util/**
              - justfile
              - .github/workflows/ci.yml

  # The crate's own suite. The crosschecks against the reference C library
  # are the interop workflow's.
  test:
    name: test / ${{ matrix.os }} / ${{ matrix.config.name }}
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.run == 'true'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config:
          - name: default
            flags: ""
          - name: full
            flags: --features "serde zfp fast-deflate provenance ndarray"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      # Writer for the `ci` group: the widest dependency set in this workflow.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.config.name == 'full' }}
          cache-on-failure: true

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-nextest,cargo-hack,just

      - name: Tests
        run: cargo nextest run --locked ${{ matrix.config.flags }}

      # rustdoc compiles doctests, so nextest cannot run them.
      - name: Doctests
        run: cargo test --locked --doc ${{ matrix.config.flags }}

      # Subsets of `full`, on one host: a feature that only compiles beside
      # another surfaces here.
      - name: Tests, each optional feature alone
        if: matrix.os == 'ubuntu-latest' && matrix.config.name == 'default'
        run: just test-each-feature

      - name: Doctests, each optional feature alone
        if: matrix.os == 'ubuntu-latest' && matrix.config.name == 'default'
        run: just doctest-each-feature

  lint:
    name: lint / ubuntu-latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Formatting
        run: just fmt-check

      - name: Clippy
        run: just clippy

      # A debug build hides two things: `debug_assert!` still type-checks its
      # argument in release (issue #288), and `--release`-only lints never fire.
      - name: Check (release)
        run: just check-release

      - name: Rustdoc
        run: just doc

      - name: Cargo.lock is current
        run: cargo update --workspace --locked

      # Each example ends in assertions, so running them tests the public API.
      # Clippy above built them with the same features.
      - name: Run every example
        run: just examples

  # The published documentation as docs.rs builds it.
  docs-rs:
    name: docs.rs / ubuntu-latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: docs-rs
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Rustdoc
        run: just docs-rs

  ci-ci-guard:
    name: ci-ci-guard
    runs-on: ubuntu-latest
    needs: [changes, test, lint, docs-rs]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.run == 'true' && contains(needs.*.result, 'skipped'))
        run: exit 1
