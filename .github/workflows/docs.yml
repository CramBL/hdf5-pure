name: Docs

# Build the Material for MkDocs site on every pull request, and publish it to
# GitHub Pages when the Release workflow dispatches this one for a release, so
# the site describes the latest release.
#
# One-time setup: in the repository settings, set
#   Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# No `gh-pages` branch is used; the built site is uploaded as a Pages artifact
# and served directly from the deployment below.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true

jobs:
  # Whether the pull request touches what this workflow reads. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            run:
              - scripts/python/**
              - docs/**
              - mkdocs.yml
              - CHANGELOG.md
              - justfile
              - scripts/docs.just
              - .github/workflows/docs.yml

  build:
    name: build / ubuntu-latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: ${{ github.event_name == 'pull_request' }}
          cache-dependency-glob: scripts/python/uv.lock

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Build the site
        run: just docs::build

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    name: deploy / github-pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  ci-docs-guard:
    name: ci-docs-guard
    runs-on: ubuntu-latest
    needs: [changes, build]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.run == 'true' && contains(needs.*.result, 'skipped'))
        run: exit 1
