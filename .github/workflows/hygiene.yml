name: Hygiene

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true
  RUST_BACKTRACE: 1

jobs:
  # Repository-wide checks, so this runs on every pull request.
  checks:
    name: checks / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: hygiene
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-shear,just,typos,zizmor

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/python/uv.lock

      - name: Unused dependencies
        run: just hygiene::shear

      - name: Workflows
        run: just hygiene::zizmor

      - name: Spelling
        run: just hygiene::typos

      # The interop matrix must include the release `hdf5-metno` bundles, which
      # the crosschecks in `ci.yml` link.
      - name: Interop matrix lists the bundled release
        run: |
          version="$(just interop::hdf5-bundled-version)"
          echo "hdf5-metno bundles $version"
          if ! grep -qE "^\s+version: \[.*\"$version\".*\]" .github/workflows/interop.yml; then
            echo "::error::$version is not in the interop matrix version list."
            exit 1
          fi

      - name: Python formatting
        run: just python::fmt-check

      - name: Python lint
        run: just python::lint

      - name: Python tests
        run: just python::test

  prose:
    name: prose / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate diffs against the base ref, and lints every commit in the range.
          fetch-depth: 0

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/python/uv.lock

      - name: Sync Vale packages
        run: just prose::sync

      # A pull request is gated against its base. A push to main is a merged
      # pull request, gated against the commit before it.
      - name: Prose on added lines and commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: just prose::added "$BASE"

  ci-hygiene-guard:
    name: ci-hygiene-guard
    runs-on: ubuntu-latest
    needs: [checks, prose]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
