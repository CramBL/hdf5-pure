name: Release

# Publish the release commit merged to main: the pull request `just
# release::pr` opens, whose subject starts with "Release v". A release is
# therefore a reviewed merge, and nothing else starts one. Re-running the job
# resumes after a failure: every public step is skipped once it has happened.
#
# One-time setup: the crate's Trusted Publishing entry on crates.io naming
# this repository and `release.yml`.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'Release v')
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      # The credentials stay: the publish step pushes the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just,cargo-binstall

      # From its own releases: the version in install-action's pinned manifest
      # reads an older rustdoc format than the pinned toolchain writes.
      - name: Install cargo-semver-checks
        run: cargo binstall -y cargo-semver-checks

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Authenticate with crates.io
        id: crates-io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          # The tagger of the annotated release tag.
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: just release::publish
