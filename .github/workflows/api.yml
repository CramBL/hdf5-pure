name: API

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true
  RUST_BACKTRACE: 1

jobs:
  # Whether the pull request touches what this workflow reads. Every other
  # event runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - name: Filter the changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            run:
              - "**/*.rs"
              - "**/Cargo.toml"
              - Cargo.toml
              - build.rs
              - Cargo.lock
              - CHANGELOG.md
              - rust-toolchain.toml
              - .cargo/**
              - scripts/python/**
              - justfile
              - scripts/constants.just
              - scripts/nightly.txt
              - scripts/api.just
              - scripts/api-profiles.toml
              - .github/workflows/api.yml

  # The public-API delta against the latest release, checked against the
  # release type the changelog calls for: a pull request that breaks the API
  # marks its entry **Breaking:**, and a release commit, whose [Unreleased] is
  # empty, is measured against the section it promotes. RELEASES.md covers what
  # this cannot see.
  semver:
    name: semver / ubuntu-latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release type comes from the changelog diff against the base ref.
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: api
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/python/uv.lock

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just cargo-semver-checks@0.50.0

      # The migration check reads rustdoc JSON from the dated nightly the scripts pin.
      - name: Install the rustdoc JSON nightly
        run: just nightly

      # Each guaranteed crate's public API under each profile scripts/api-profiles.toml lists.
      - name: Public API delta
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: just api::semver "$BASE"

  msrv:
    name: msrv / ubuntu-latest
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: cargo-msrv,just

      - name: Build on the declared rust-version
        run: just api::msrv

  ci-api-guard:
    name: ci-api-guard
    runs-on: ubuntu-latest
    needs: [changes, semver, msrv]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.run == 'true' && contains(needs.*.result, 'skipped'))
        run: exit 1
