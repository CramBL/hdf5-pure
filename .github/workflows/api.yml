name: API

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The public-API delta against the latest release. Green means the manifest
  # already declares a bump large enough to carry the change, which under this
  # repo's convention the breaking PR made itself. RELEASES.md covers what this
  # cannot see.
  semver:
    name: semver / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: api
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The action rather than `just api::semver`: it pairs a cargo-semver-checks
      # build with a toolchain whose rustdoc JSON that build can parse.
      - name: Public API delta
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: default-features
          features: serde,zfp,provenance,ndarray

  # Types reachable through the public API without being nameable, which
  # `cargo-semver-checks` matches by path and therefore cannot see.
  api-surface:
    name: api surface / nightly
    runs-on: ubuntu-latest

    env:
      RUSTUP_TOOLCHAIN: nightly

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # 2026-03-27
        with:
          toolchain: nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: api
          save-if: false

      - name: Install tools
        uses: taiki-e/install-action@920ab1831fbf4fb3ef75c8ead83556c918bb7290 # v2.79.8
        with:
          tool: just

      - name: Scan the public API surface
        run: just api::api-surface

  ci-api-guard:
    name: ci-api-guard
    runs-on: ubuntu-latest
    needs: [semver, api-surface]
    permissions:
      contents: none
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
