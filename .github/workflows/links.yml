# Every link in the tracked Markdown files and Rust sources, weekly. The Links
# job of hygiene.yml gates the links a change adds, and this sweep reports the
# ones that break after a merge.
name: Links

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

env:
  JUST_COLOR: always
  JUST_VERBOSE: 1
  JUST_TIMESTAMP: true

jobs:
  lychee:
    name: lychee / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0,lychee

      # The token lifts GitHub's rate limit for the several hundred issue links.
      - name: Check every link
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just hygiene::lychee
