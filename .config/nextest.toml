[[profile.default.overrides]]
filter = '''
package(hdf5-pure-crosscheck) & (
    test(/^c_absence_predicate::/) |
    test(/^c_write_compat::/) |
    test(/^hdf5::/) |
    test(/^libver_matrix::/) |
    test(/^libver_output::/) |
    test(/^matio_crosscheck::/) |
    test(/^object_header_v1_malformed::/) |
    test(/^repack::/) |
    test(/^userblock_base_address::/)
)
'''
test-group = "compat"
