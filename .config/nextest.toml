# cargo-nextest configuration (issue #269).
#
# Why nextest at all: `cargo test` runs the integration binaries one after
# another, so a suite spread over 100+ of them spends most of its wall clock on
# one core. Measured here on a 10-core machine at `--all-features`, after the
# per-append `fsync` fix in the same issue: 46.1s under `cargo test` (115% CPU)
# against 17.9s under nextest (421% CPU). The work is identical; only the
# scheduling differs.
#
# nextest does not run doctests -- it has no way to, since they are compiled by
# `rustdoc` rather than into a test binary. The pre-push gate is therefore
# `cargo nextest run` *and* `cargo test --doc` -- `just ci-essentials` runs both,
# as does CI, in separate steps so a doctest failure is not silently dropped.
#
# One property this scheduling now depends on: tests in *different* binaries run
# at the same time, which `cargo test` never did (it ran binaries one at a time,
# concurrent only within each). Most tests here work in a `tempdir()` and are
# unaffected, but 225 of them write a hardcoded name into the shared system
# temp directory, and those were previously serialized by binary. They are all
# distinct -- each file prefixes its own (`hdf5_pure_ub_`, `hdf5_pure_fs_`, ...)
# -- so nothing collides. Keep it that way: a name reused across two test files
# would now be two processes writing one path, which fails only sometimes and,
# because the locks are mandatory there, mostly on Windows.

# Require a version that understands this file's schema, so an older nextest
# fails loudly instead of ignoring settings the gate depends on.
nextest-version = "0.9.145"

[profile.default]
# A test that takes 30s is reported; one that takes 90s fails the run.
#
# This exists because of what #269 found: a single test spent 117s issuing one
# `fsync` per appended element, five times the rest of the suite combined, and
# nothing flagged it -- nextest's stock 60s warning was not in play because the
# suite ran under `cargo test`, which reports no per-test timings at all.
#
# The bound has room. The slowest legitimate test in the suite is ~13s here
# (`crates/crosscheck/tests/main/dense_attr_limits.rs`, `c_absence_predicate`), and CI runners are
# slower than a dev machine but not seven times slower. A test that genuinely
# needs longer should say so with an override below rather than by raising this
# ceiling for everything.
#
# The usual cause is the one above: a session left on the default
# `SyncPolicy::Always` while looping over appends. `SyncPolicy::OnClose` writes
# byte-identical files (`tests/main/sync_policy.rs` asserts that) and still barriers
# at `close`. Rule that out before reaching for a per-test override.
slow-timeout = { period = "30s", terminate-after = 3 }

# This PAGE free-space crosscheck can be substantially slower on loaded CI
# runners, especially with older libhdf5 releases. Give only this test more
# room while keeping the suite-wide timeout strict.
[[profile.default.overrides]]
filter = '''
package(hdf5-pure-crosscheck) &
test(/^file_space::a_paged_persisting_edit_that_tracks_no_free_space_records_the_end_of_allocation_for_libhdf5$/)
'''
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
# Keep running tests within a selected domain after one fails. The workflow also
# continues to later domains, so one matrix cell reports every failing subsystem.
fail-fast = false

[test-groups]
# Semantic labels for the HDF5 crosschecks. They all retain nextest's normal
# concurrency. CI selects them one at a time to make subsystem failures visible.
# Any crosscheck test not matched below stays in `@global`, which CI runs as
# `other` so a newly added module is never omitted by default.
file-space = { max-threads = "num-cpus" }
append = { max-threads = "num-cpus" }
attributes = { max-threads = "num-cpus" }
storage = { max-threads = "num-cpus" }
editing = { max-threads = "num-cpus" }
types = { max-threads = "num-cpus" }
compat = { max-threads = "num-cpus" }

[[profile.default.overrides]]
filter = '''
package(hdf5-pure-crosscheck) & (
    test(/^file_space::/) |
    test(/^file_space_fuzz::/) |
    test(/^page_buffer::/)
)
'''
test-group = "file-space"

[[profile.default.overrides]]
filter = '''
package(hdf5-pure-crosscheck) & (
    test(/^append::/) |
    test(/^append_writer::/) |
    test(/^bounded_append::/) |
    test(/^buffered_append::/) |
    test(/^owned_append::/) |
    test(/^owned_swmr::/) |
    test(/^swmr_append::/) |
    test(/^swmr_refresh::/)
)
'''
test-group = "append"

[[profile.default.overrides]]
filter = '''
package(hdf5-pure-crosscheck) & (
    test(/^attr_count::/) |
    test(/^attr_message_size::/) |
    test(/^attr_width::/) |
    test(/^dense_attr_limits::/) |
    test(/^enum_attr::/) |
    test(/^null_attr_padding::/) |
    test(/^vlen_string_attrs::/)
)
'''
test-group = "attributes"

[[profile.default.overrides]]
filter = '''
package(hdf5-pure-crosscheck) & (
    test(/^chunk_btree_offset_width::/) |
    test(/^chunk_index_grid::/) |
    test(/^dense_huge_objects::/) |
    test(/^empty_chunked::/) |
    test(/^extensible_array::/) |
    test(/^external_storage::/) |
    test(/^fill_value::/) |
    test(/^fractal_heap_dense_links::/) |
    test(/^global_heap_length_width::/) |
    test(/^layout_introspection::/) |
