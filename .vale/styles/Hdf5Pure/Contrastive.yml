# A sentence states the current behaviour on its own, never against a
# historical or hypothetical alternative.
extends: existence
message: "State the behavior directly. Preserve distinctions that define return values, defaults, error handling, or safety."
level: error
ignorecase: true
nonword: true
tokens:
  - '\brather\s+than\b'
  - '\binstead\s+of\b'
  - '\bas\s+opposed\s+to\b'
