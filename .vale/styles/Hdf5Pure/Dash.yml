# Split independent clauses into sentences. Use an en dash only for a
# numeric range ("1.8–2.2", "0–7"). Box-drawing characters are decoration,
# never a section header.
extends: existence
message: "Dash '%s': split independent clauses into sentences. Use an en dash only for a numeric range."
level: error
nonword: true
tokens:
  - '[—═]'
  - '—'
  # Flags an en dash ONLY if it touches a space/punctuation
  - '(?<!\w)–|–(?!\w)'
