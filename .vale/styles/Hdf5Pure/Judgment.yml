# Mechanical behaviour is stated as a rule, never as a bargain or a
# judgment: "retried once", not "worth one retry".
extends: existence
message: "For '%s', state the exact condition, operation, or measurable effect."
level: error
ignorecase: true
nonword: true
tokens:
  - '\bworth\s+(?:a|an|one|the|its)\b'
  - '\bdeserves?\b'
  - '\bearn(?:s|ed|ing)?\b'
  - '\bis\s+happy\s+(?:with|to)\b'
  - '\btrusts?\b'
