# The trailers a commit message may end with: attribution between people
# (Signed-off-by, Co-authored-by, Reviewed-by, Tested-by, Acked-by), a tool
# that assisted (Assisted-by), and an issue reference (Closes, Fixes,
# Resolves, Refs). Every other Key-Name line is rejected, and so is a link to
# an agent session. The session token omits the scheme so that lychee does
# not read it as a link.
extends: existence
message: "Commit trailer: '%s'. Accepted: Signed-off-by, Co-authored-by, Reviewed-by, Tested-by, Acked-by, Assisted-by, and Closes, Fixes, Resolves or Refs with an issue number."
level: error
scope: raw
nonword: true
tokens:
  - '(?m)^(?!(?:Co-authored-by|Signed-off-by|Reviewed-by|Tested-by|Acked-by|Assisted-by):\s)[A-Z][A-Za-z]*(?:-[A-Za-z]+)+:\s'
  - '\bclaude\.ai/code/session_\w+'
