[project]
name = "hdf5-pure-scripts"
version = "0"
description = "The repository's Python tooling: HDF5 builds for interop, the API surface scan, the prose lint and the release"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hdf5-build = "hdf5_pure_scripts.build_hdf5:main"
api-surface = "hdf5_pure_scripts.api_surface:main"
release = "hdf5_pure_scripts.release:main"
lint-prose = "hdf5_pure_scripts.prose:main"

[dependency-groups]
dev = ["ruff>=0.16.6", "pytest>=9.1.1", "pyyaml>=6.0.3"]

[tool.uv]
default-groups = []

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
